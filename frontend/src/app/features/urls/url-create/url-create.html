<app-analytics></app-analytics>

<div class="container">

    <h1>
        URL Shortener
    </h1>

        <input
            type="text"
            [(ngModel)]="originalUrl"
            placeholder="Enter URL">

        <input
            type="text"
            [(ngModel)]="customAlias"
            placeholder="Custom Alias (Optional)">

        <label>
            Expiry Date (Optional)
        </label>

        <input
            type="datetime-local"
            [(ngModel)]="expiryDate">

        <button
            (click)="generateUrl()">

            Generate

        </button>

    <div
        *ngIf="generatedUrl">

        <h3>
            Short URL
        </h3>

        <a
            [href]="generatedUrl"
            target="_blank">

            {{ generatedUrl }}
        </a>

    </div>

</div>

<app-url-list
  #urlList>
</app-url-list>
