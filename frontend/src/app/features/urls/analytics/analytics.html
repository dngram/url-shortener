<div
    *ngIf="analytics"
    class="analytics">

    <div class="analytics-card">

        <span class="analytics-label">
            Total URLs
        </span>

        <span class="analytics-value">
            {{ analytics.totalUrls }}
        </span>

    </div>

    <div class="analytics-card">

        <span class="analytics-label">
            Total Clicks
        </span>

        <span class="analytics-value">
            {{ analytics.totalClicks }}
        </span>

    </div>

    <div class="analytics-card">

        <span class="analytics-label">
            Expired URLs
        </span>

        <span class="analytics-value">
            {{ analytics.expiredUrls }}
        </span>

    </div>

    <div class="analytics-card">

        <span class="analytics-label">
            Most Clicked
        </span>

        <span class="analytics-value">
            {{ analytics.mostClickedShortCode }}
        </span>

        <span class="analytics-subtext">
            {{ analytics.highestClickCount }} clicks
        </span>

    </div>

</div>
